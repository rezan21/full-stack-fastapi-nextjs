[project]
name = "repo-tooling"
version = "0.1.0"
requires-python = ">=3.14,<4.0"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "prek>=0.4.11,<1.0.0",
    "library-skills>=0.0.19,<1.0.0",
]

[tool.typos.files]
extend-exclude = [
    ".agents/",
    "uv.lock",
    "backend/uv.lock",
    "frontend/bun.lock",
    "packages/react-email/bun.lock",
    "backend/htmlcov/",
    "frontend/src/assets/images/",
]

[tool.typos.default.extend-words]
PN = "PN"

[tool.typos.default.extend-identifiers]
alls = "alls"
