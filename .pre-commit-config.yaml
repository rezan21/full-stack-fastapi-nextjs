# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                backend/app/email-templates/.*
            )$
      - id: trailing-whitespace
  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # frozen: v1.48.0
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: local
    hooks:
      - id: local-biome-check
        name: biome check
        entry: bash -c 'cd frontend && bun run lint'
        language: system
        types: [text]
        files: ^frontend/

      - id: local-api-client
        name: api client up to date
        entry: bash scripts/generate-client.sh
        language: system
        pass_filenames: false
        files: ^(backend/app/|backend/openapi\.json|frontend/openapi-ts\.config\.ts|frontend/src/client/)

      - id: local-ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: uv run --project backend mypy --config-file backend/pyproject.toml backend/app
        require_serial: true
        language: unsupported
        pass_filenames: false

      - id: local-ty
        name: ty check
        entry: uv run --project backend ty check backend/app
        require_serial: true
        language: unsupported
        pass_filenames: false

      - id: local-library-skills
        name: backend skills resolve
        entry: bash -c 'cd backend && uv run --project .. library-skills --check --claude'
        language: system
        pass_filenames: false
        files: ^backend/(\.agents/|\.claude/|pyproject\.toml|uv\.lock|\.python-version)
