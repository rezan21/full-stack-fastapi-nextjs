name: full-stack-fastapi-nextjs

x-backend: &backend
  image: backend:latest
  build:
    context: ../backend
    dockerfile: Dockerfile
  environment:
    PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
    SECRET_KEY: ${SECRET_KEY:?Variable not set}
    FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
    FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
    SMTP_HOST: ${SMTP_HOST:?Variable not set}
    SMTP_PORT: ${SMTP_PORT:?Variable not set}
    SMTP_TLS: ${SMTP_TLS:?Variable not set}
    SMTP_SSL: ${SMTP_SSL:?Variable not set}
    SMTP_USER: ${SMTP_USER?Variable not set}
    SMTP_PASSWORD: ${SMTP_PASSWORD?Variable not set}
    EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:?Variable not set}
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
    SENTRY_DSN: ${SENTRY_DSN:-}

services:

  proxy:
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --accesslog
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  prestart:
    <<: *backend
    command: bash scripts/prestart.sh
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.services.backend.loadbalancer.server.port=8000
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`))
      - traefik.http.routers.backend-http.entrypoints=http
      - traefik.http.middlewares.auth-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.auth-ratelimit.ratelimit.burst=10
      - traefik.http.routers.backend-auth-http.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api/v1/login/access-token`) || PathPrefix(`/api/v1/users/signup`) || PathPrefix(`/api/v1/users/me/email`) || PathPrefix(`/api/v1/users/confirm-email`) || PathPrefix(`/api/v1/password-recovery`) || PathPrefix(`/api/v1/reset-password`))
      - traefik.http.routers.backend-auth-http.entrypoints=http
      - traefik.http.routers.backend-auth-http.middlewares=auth-ratelimit
      - traefik.http.routers.backend-auth-http.priority=1000

  frontend:
    image: frontend:latest
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
    build:
      context: ../frontend
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000
      - traefik.http.routers.frontend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.frontend-http.entrypoints=http
      - traefik.http.routers.frontend-auth-http.rule=Host(`${DOMAIN:-localhost}`) && Method(`POST`) && (Path(`/login`) || Path(`/signup`) || Path(`/signup/complete`) || Path(`/confirm-email`) || Path(`/recover-password`) || Path(`/reset-password`))
      - traefik.http.routers.frontend-auth-http.entrypoints=http
      - traefik.http.routers.frontend-auth-http.middlewares=auth-ratelimit
      - traefik.http.routers.frontend-auth-http.priority=1000

volumes:
  app-db-data:
