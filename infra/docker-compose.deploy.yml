services:

  proxy:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-certificates:/certificates
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --entrypoints.https.forwardedheaders.trustedips=${TRUSTED_PROXIES:-127.0.0.1/32}
      - --entrypoints.https.http.middlewares=hsts@docker
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog
      - --log

  db:
    restart: always

  backend:
    restart: always
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
    labels:
      - traefik.http.middlewares.hsts.headers.stsseconds=31536000
      - traefik.http.middlewares.auth-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=${PROXY_HOPS:-0}
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:?Variable not set}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`))
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
      - traefik.http.routers.backend-https.tls.certresolver=le
      - traefik.http.routers.backend-auth-https.rule=Host(`${DOMAIN:?Variable not set}`) && (PathPrefix(`/api/v1/login/access-token`) || PathPrefix(`/api/v1/users/signup`) || PathPrefix(`/api/v1/users/me/email`) || PathPrefix(`/api/v1/users/confirm-email`) || PathPrefix(`/api/v1/password-recovery`) || PathPrefix(`/api/v1/reset-password`) || Path(`/api/v1/users/me/password`) || (Path(`/api/v1/users/me`) && Method(`DELETE`)))
      - traefik.http.routers.backend-auth-https.entrypoints=https
      - traefik.http.routers.backend-auth-https.middlewares=auth-ratelimit
      - traefik.http.routers.backend-auth-https.priority=1000
      - traefik.http.routers.backend-auth-https.tls=true
      - traefik.http.routers.backend-auth-https.tls.certresolver=le

  frontend:
    restart: always
    labels:
      - traefik.http.routers.frontend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.frontend-https.entrypoints=https
      - traefik.http.routers.frontend-https.tls=true
      - traefik.http.routers.frontend-https.tls.certresolver=le
      - traefik.http.routers.frontend-auth-https.rule=Host(`${DOMAIN:?Variable not set}`) && Method(`POST`) && (Path(`/login`) || Path(`/signup`) || Path(`/signup/complete`) || Path(`/confirm-email`) || Path(`/recover-password`) || Path(`/reset-password`) || Path(`/settings`))
      - traefik.http.routers.frontend-auth-https.entrypoints=https
      - traefik.http.routers.frontend-auth-https.middlewares=auth-ratelimit
      - traefik.http.routers.frontend-auth-https.priority=1000
      - traefik.http.routers.frontend-auth-https.tls=true
      - traefik.http.routers.frontend-auth-https.tls.certresolver=le

volumes:
  traefik-certificates:
