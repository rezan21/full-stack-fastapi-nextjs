services:

  proxy:
    image: traefik:3.6
    ports:
      - "80:80"
      - "8090:8080"
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --log.level=WARN
      - --api
      - --api.insecure=true
  db:
    ports:
      - "5432:5432"
    command: postgres -c log_min_messages=warning

  adminer:
    ports:
      - "8080:8080"

  backend:
    ports:
      - "8000:8000"
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --no-access-log
    develop:
      watch:
        - path: ../backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ../backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ../backend/htmlcov:/app/backend/htmlcov
    environment:
      FASTAPI_ENV: "development"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      NODE_ENV: "development"
      API_URL: "http://backend:8000"
    develop:
      watch:
        - action: sync
          path: ../frontend
          target: /app/frontend
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/bun.lock
    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_QUIET: "true"

  playwright:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - frontend
      - mailpit
    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=http://frontend:3000
      - API_URL=http://backend:8000
      - MAILPIT_HOST=http://mailpit:8025
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ../frontend/blob-report:/app/frontend/blob-report
      - ../frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
