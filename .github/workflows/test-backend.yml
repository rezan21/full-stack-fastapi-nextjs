name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.dev.yml
      COMPOSE_ENV_FILES: backend/.env
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Check that setup-uv knows the checksum before bumping this version
          version: "0.11.18"
      - name: Create backend/.env
        run: cp backend/.env.example backend/.env
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailpit
      - run: docker compose run --rm dbsetup
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
